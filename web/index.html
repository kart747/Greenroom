<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenroom</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Greenroom UI. Everything is served by the local FastAPI server; no CDN,
       no build step. Each screen is rendered by js/app.js into #view. -->
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/home" aria-label="Greenroom home">
      <img src="icon.svg" alt="" width="28" height="28"><span>Greenroom</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/home" data-nav="home">Home</a>
      <a href="#/characters" data-nav="characters">Practice</a>
      <a href="#/progress" data-nav="progress">Progress</a>
      <a href="#/review" data-nav="review">Review</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="status" id="status" title="Model status"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
